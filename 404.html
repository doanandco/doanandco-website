<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — Doan & Co</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cream:#F5F0E8;--bark:#2C2416;--moss:#4A5240;--clay:#B5825A;--linen:#E8E0D0}
    body{background:var(--cream);color:var(--bark);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
    .num{font-size:clamp(6rem,20vw,12rem);font-weight:300;line-height:1;color:var(--linen)}
    h1{font-size:clamp(2rem,4vw,3rem);font-weight:300;margin:16px 0}
    h1 em{font-style:italic;color:var(--moss)}
    p{font-family:'DM Mono',monospace;font-size:.75rem;line-height:1.9;opacity:.5;max-width:400px;margin:0 auto 40px}
    a{display:inline-block;background:var(--bark);color:var(--cream);padding:14px 32px;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:background .3s}
    a:hover{background:var(--moss)}
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>This page has<br><em>gone offline.</em></h1>
  <p>The page you're looking for doesn't exist — but that might not be the worst thing. The real world is out there.</p>
  <a href="/">Back to Home</a>
</body>
</html>
